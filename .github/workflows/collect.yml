name: collect
# The daily refresh. Deterministic, gated, committed by a bot identity that the guard workflow
# recognises. Two runs: 06:45 IST (before market, for the morning board) and 18:15 IST (after
# close, for listing prints and final subscription).
on:
  schedule:
    - cron: "15 1 * * *"     # 06:45 IST
    - cron: "45 12 * * *"    # 18:15 IST
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated module names (blank = all)"
        required: false
        default: ""

concurrency: { group: collect, cancel-in-progress: false }

permissions:
  contents: write
  actions: write        # to dispatch deploy.yml: a push made with GITHUB_TOKEN does not trigger workflows

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }

      - name: Install
        run: pip install -e ".[dev]"

      # Collector output lives on the orphan `data` branch, never on main: ~1 MB of history a day stays
      # off the branch humans work on. It is laid over ./data for the run and committed back below.
      - uses: actions/checkout@v4
        with: { ref: data, path: _data, fetch-depth: 1 }

      - name: Lay the live document over ./data — it is the previous run and the delta baseline
        run: |
          cp _data/latest.json data/latest.json
          mkdir -p data/history && cp -R _data/history/. data/history/ 2>/dev/null || true
          cp _data/latest.json /tmp/prev_latest.json

      - name: Collect
        env:
          ANGEL_API_KEY:     ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN:         ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          set -o pipefail
          ONLY="${{ github.event.inputs.only }}"
          if [ -n "$ONLY" ]; then python -m collector --only "$ONLY" --max-seconds 900 | tee collect.log
          else python -m collector --max-seconds 900 | tee collect.log; fi

      - name: Gate — the validator must pass or nothing is committed
        run: python scripts/validate.py data/latest.json --prev /tmp/prev_latest.json --max-age-hours 2

      - name: Build the site — proves the document renders into a page before it is committed
        run: python site/build.py

      - name: Commit to the data branch as the collector bot
        id: commit
        run: |
          cp data/latest.json _data/latest.json
          rm -rf _data/history && mkdir -p _data/history && cp -R data/history/. _data/history/
          cd _data
          git config user.name  "ipo-desk-bot"
          git config user.email "ipo-desk-bot@users.noreply.github.com"
          git add -A latest.json history
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "collect: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin data
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      - name: Publish — dispatch the deploy workflow for the commit just pushed
        if: steps.commit.outputs.pushed == '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run deploy.yml --ref main

      # After the commit and never able to fail the run: a message is a courtesy, the document is the product.
      # Silent unless a rule became true since the previous document (collector/alerts.py). No secrets = dry run.
      - name: Alerts
        if: always() && steps.commit.outputs.pushed == '1'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN$NTFY_TOPIC" ]; then SEND=--send; else SEND=""; fi
          python -m collector.alerts --prev /tmp/prev_latest.json --new data/latest.json $SEND

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collect-log-${{ github.run_number }}
          path: collect.log
          retention-days: 14
