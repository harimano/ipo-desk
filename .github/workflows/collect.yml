name: collect
# The daily refresh. Deterministic, gated, committed by a bot identity that the guard workflow
# recognises. Two runs: 06:45 IST (before market, for the morning board) and 18:15 IST (after
# close, for listing prints and final subscription).
on:
  schedule:
    - cron: "15 1 * * *"     # 06:45 IST
    - cron: "45 12 * * *"    # 18:15 IST
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated module names (blank = all)"
        required: false
        default: ""

concurrency: { group: collect, cancel-in-progress: false }

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }

      - name: Install
        run: pip install -e ".[dev]"

      - name: Keep the live document as the delta baseline
        run: cp data/latest.json /tmp/prev_latest.json

      - name: Collect
        env:
          ANGEL_API_KEY:     ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN:         ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          set -o pipefail
          ONLY="${{ github.event.inputs.only }}"
          if [ -n "$ONLY" ]; then python -m collector --only "$ONLY" --max-seconds 900 | tee collect.log
          else python -m collector --max-seconds 900 | tee collect.log; fi

      - name: Gate — the validator must pass or nothing is committed
        run: python scripts/validate.py data/latest.json --prev /tmp/prev_latest.json --max-age-hours 2

      - name: Build the page with a fresh fallback snapshot
        run: python site/build.py

      - name: Commit as the collector bot
        run: |
          git config user.name  "ipo-desk-bot"
          git config user.email "ipo-desk-bot@users.noreply.github.com"
          git add data/latest.json data/history
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "collect: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collect-log-${{ github.run_number }}
          path: collect.log
          retention-days: 14
