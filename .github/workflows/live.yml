name: live
# The market-hours loop: one job stays up and refreshes live.json on the `live` branch every five minutes (three
# calls a tick). A hosted job may run six hours, so the day is two jobs: 08:55-13:10 and 12:55-17:20 IST (the second start cancels the first). Started by
# the Cloudflare Worker (ops/trigger-worker); the crons here are the fallback. A new start replaces a running one.
on:
  schedule:
    - cron: "25 3 * * 1-5"     # 08:55 IST
    - cron: "25 7 * * 1-5"     # 12:55 IST
  workflow_dispatch:
    inputs:
      until:
        description: "HH:MM IST to stop at (blank = by the clock: 13:10 before 12:30, else 17:20)"
        required: false
        default: ""

# A Worker start (workflow_dispatch) replaces a running loop — that is how the afternoon half takes over. GitHub's
# fallback cron runs hours late (28-30 Sep 2026: ~15:28 IST, cancelling the Worker's afternoon loop at the close), so
# a scheduled start never cancels: it queues, and finds its half already over when the running loop ends.
concurrency:
  group: live
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}
permissions:
  contents: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with: { ref: data, path: _data, fetch-depth: 1 }
      - name: The live branch — created once, one commit for ever
        run: |
          git clone --quiet "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" _live
          cd _live
          if git ls-remote --exit-code --heads origin live >/dev/null; then git checkout -q live
          else git checkout -q --orphan live && git rm -rfq . && echo '{}' > live.json && git add live.json \
               && git -c user.name=ipo-desk-bot -c user.email=ipo-desk-bot@users.noreply.github.com commit -qm "live: start" && git push -q origin live; fi
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -e ".[dev]" >/dev/null      # dev: the same ruff the lint step below runs
      - name: Loop
        run: |
          UNTIL="${{ github.event.inputs.until }}"
          if [ -z "$UNTIL" ]; then if [ "$(TZ=Asia/Kolkata date +%H%M)" -lt 1230 ]; then UNTIL=13:10; else UNTIL=17:20; fi; fi
          echo "looping until $UNTIL IST"
          python -m collector.live --board _data/latest.json --out _live/live.json --until "$UNTIL" --interval 300 --publish _live

      # Last, as in collect.yml: a lint slip turns the finished job red so it is seen, and never keeps the loop from
      # starting — every tick of live.json was pushed long before this runs. Runs on cancel too (always()).
      - name: Lint — ruff over the whole tree (fails the job, never the data)
        if: always()
        run: ruff check .
