name: deploy
# Every push to main, and after every collect: (1) the guard — the document comes from the data branch
# and only the bot writes there;
# (2) the validator must pass on what is about to go live; (3) build _site and deploy the gated Worker
# (ops/site-worker). GitHub Pages was switched off on 28 Oct 2026: the Worker behind Cloudflare Access is the only door.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read         # the cloudflare job snapshots the run list for /admin

concurrency: { group: deploy, cancel-in-progress: true }

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with: { ref: data, path: _data, fetch-depth: 1 }
      - name: The document is the collector's alone
        run: |
          if git ls-files --error-unmatch data/latest.json >/dev/null 2>&1 || [ -n "$(git ls-files data/history)" ]; then
            echo "::error::data/latest.json or data/history is tracked on main. Collector output lives on the data branch only."
            exit 1
          fi
          author="$(git -C _data log -1 --format=%an)"
          if [ "$author" != "ipo-desk-bot" ]; then
            echo "::error::the data branch's last commit is by '$author'. Only the collector bot may write it."
            echo "Research goes in data/research/, clause readings in data/quota-reviews/, the sweep in data/investors.json — all on main."
            exit 1
          fi
          cp _data/latest.json data/latest.json
          echo "guard ok"
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Validate what is about to go live
        run: python scripts/validate.py data/latest.json --max-age-hours 72
      - name: Research files must parse and carry a name
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = []
          for d in ("data/research", "data/quota-reviews"):
              for f in pathlib.Path(d).glob("*.json"):
                  try:
                      b = json.loads(f.read_text(encoding="utf8"))
                      if not b.get("name"): bad.append(f"{f}: missing name")
                  except Exception as e:
                      bad.append(f"{f}: {e}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("research layer ok")
          PY

  # The site (ops/site-worker): _site served by a Cloudflare Worker behind Cloudflare Access. Needs secrets
  # CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID and variables ACCESS_TEAM_DOMAIN + ACCESS_AUD — the README there
  # walks through every one.
  cloudflare:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with: { ref: data, path: _data, fetch-depth: 1 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Build _site — page, split data files, research, logos
        run: |
          cp _data/latest.json data/latest.json
          mkdir -p data/logos && cp -R _data/logos/. data/logos/ 2>/dev/null || true
          mkdir -p data/history && cp -R _data/history/. data/history/ 2>/dev/null || true   # /admin's "since yesterday"
          python site/build.py
      - name: Snapshot the run list for /admin (the Actions token has no 60-an-hour limit; the browser's own call is a bonus)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api "repos/${{ github.repository }}/actions/runs?per_page=40" \
            --jq '[.workflow_runs[] | {id, name, event, status, conclusion, run_started_at, created_at, updated_at, html_url, display_title, run_attempt}]' \
            > /tmp/runs.json || echo '[]' > /tmp/runs.json
          gh api "repos/${{ github.repository }}/commits?sha=live&per_page=1" \
            --jq '.[0] | {at: .commit.committer.date, msg: .commit.message}' > /tmp/live.json || echo 'null' > /tmp/live.json
          python scripts/runs_snapshot.py /tmp/runs.json /tmp/live.json _site/admin/runs.json
      - name: Deploy the Worker (wrangler)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ops/site-worker
          wranglerVersion: "4.154.0"      # the action's default is wrangler 3, which does not know [assets] run_worker_first
          command: deploy
          vars: |
            TEAM_DOMAIN
            POLICY_AUD
            ADMIN_EMAIL
        env:
          TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          POLICY_AUD: ${{ vars.ACCESS_AUD }}
          ADMIN_EMAIL: ${{ vars.ACCESS_ADMIN_EMAIL || 'pending' }}     # who may open /admin; wrangler refuses an empty var, and the Worker reads `pending` as unset (404)
      - name: Hand the Worker its Access-log secrets (only when CF_ACCESS_LOGS_TOKEN exists; /admin Visitors history)
        working-directory: ops/site-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_LOGS_TOKEN: ${{ secrets.CF_ACCESS_LOGS_TOKEN }}
        if: env.CF_ACCESS_LOGS_TOKEN != ''
        run: |
          printf '%s' "$CF_ACCESS_LOGS_TOKEN" | npx --yes wrangler@4.154.0 secret put CF_ACCESS_LOGS_TOKEN
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx --yes wrangler@4.154.0 secret put CF_ACCOUNT_ID
      - name: Hand the Worker the ntfy topic (only when NTFY_TOPIC exists; "Wrong number?" reports ping it)
        working-directory: ops/site-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        if: env.NTFY_TOPIC != ''
        run: printf '%s' "$NTFY_TOPIC" | npx --yes wrangler@4.154.0 secret put NTFY_TOPIC
