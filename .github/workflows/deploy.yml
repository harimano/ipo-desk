name: deploy
# Every push to main: (1) the guard — latest.json may only change under the bot's name;
# (2) the validator must pass on what is about to go live; (3) publish to Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: latest.json is the collector's alone
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qx "data/latest.json"; then
            author="$(git log -1 --format=%an)"
            if [ "$author" != "ipo-desk-bot" ]; then
              echo "::error::data/latest.json changed in a commit by '$author'. Only the collector bot may write it."
              echo "Research goes in data/research/, clause readings in data/quota-reviews/, the sweep in data/investors.json."
              exit 1
            fi
          fi
          echo "guard ok"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Validate what is about to go live
        run: python scripts/validate.py data/latest.json --max-age-hours 72
      - name: Research files must parse and carry a name
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = []
          for d in ("data/research", "data/quota-reviews"):
              for f in pathlib.Path(d).glob("*.json"):
                  try:
                      b = json.loads(f.read_text(encoding="utf8"))
                      if not b.get("name"): bad.append(f"{f}: missing name")
                  except Exception as e:
                      bad.append(f"{f}: {e}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("research layer ok")
          PY

  publish:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Rebuild the page (in case only research changed)
        run: python site/build.py
      - name: Assemble the site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/latest.json _site/data/
          cp -r data/research _site/data/ 2>/dev/null || true
          cp -r data/quota-reviews _site/data/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
