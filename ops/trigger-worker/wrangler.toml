# Cloudflare Worker config for the ipo-desk trigger. With the repo connected in Cloudflare (Workers Builds) and the
# root directory set to ops/trigger-worker, `npx wrangler deploy` reads this file: the code, the schedule and REPO
# all come from here. The one thing that is NOT here is the secret GITHUB_TOKEN — add it in the dashboard.
name = "ipo-desk"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
REPO = "harimano/ipo-desk"

[triggers]
crons = [
  "13 1 * * *",          # 06:43 IST  full
  "43 12 * * *",         # 18:13 IST  full
  "7,37 4-11 * * 1-5",   # 09:37-17:07 IST weekdays  intraday
  "7 12 * * 1-5",        # 17:37 IST  intraday
  "25 3 * * 1-5",        # 08:55 IST  live loop, morning half
  "35 7 * * 1-5",        # 13:05 IST  live loop, afternoon half
]
