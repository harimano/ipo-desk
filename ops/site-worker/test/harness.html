<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ipo-desk Worker tests</title>
<style>body{font:14px/1.5 -apple-system,system-ui,sans-serif;max-width:760px;margin:30px auto;padding:0 16px}li{margin:3px 0}.ok{color:#1d8a5b}.fail{color:#d64545;font-weight:700}h1{font-size:18px}</style></head>
<body><h1>ops/site-worker/worker.js — the gate and /api/state, in this browser</h1>
<p>Served by <code>scripts/preview.py</code> under <code>/__worker/</code>: real RS256 tokens signed with WebCrypto, D1 in memory, no Cloudflare. The same cases run under <code>node --test</code> in CI.</p>
<p id="sum">running…</p><ul id="out"></ul>
<script type="module">
import { runCases } from "./cases.mjs";
const out = document.getElementById("out"), sum = document.getElementById("sum");
try {
  const r = await runCases();
  r.all.forEach(c => { const li = document.createElement("li"); li.className = c.ok ? "ok" : "fail"; li.textContent = (c.ok ? "ok · " : "FAIL · ") + c.msg; out.appendChild(li); });
  sum.textContent = r.failed.length ? `${r.failed.length} failed, ${r.passed} passed` : `${r.passed} passed, none failed`;
  window.__result = r;
} catch (e) { sum.textContent = "harness error: " + e.message; console.error(e); window.__result = { error: e.message }; }
</script></body></html>
