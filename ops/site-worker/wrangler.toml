# The gated site: a Worker that serves _site/ (what site/build.py writes) behind Cloudflare Access.
# Deployed by deploy.yml's `cloudflare` job with `wrangler deploy` once the repo variable SITE_WORKER is "on";
# the job builds _site first, exactly as the Pages job does. Nothing here is a secret.
#
# TEAM_DOMAIN and POLICY_AUD are passed at deploy time from repo variables (ACCESS_TEAM_DOMAIN, ACCESS_AUD),
# so they are not written here; without them the Worker refuses every request (503), never serves open.
name = "ipo-desk-site"                 # NOT "ipo-desk": that name is the trigger Worker (ops/trigger-worker)
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "../../_site"
binding = "ASSETS"
run_worker_first = true                # every request goes through worker.js (the Access check) before an asset is served
not_found_handling = "none"

# The visitors ledger behind /admin (worker.js noteVisit / visitors): one KV record per signed-in email. The namespace
# ipo-desk-visits was created by Hari in the dashboard (Storage & Databases → KV) on 29 Oct 2026; the id is an
# identifier, not a secret. Remove this block and the Worker keeps nothing; the card on /admin says so.
[[kv_namespaces]]
binding = "VISITS"
id = "453437b160ee4001871d2ef0192d21ba"

# Each reader's own saved dashboard (worker.js handleApi, /api/state): a D1 database, one row per email and part
# (schema.sql; the Worker creates the table itself). Hari creates the database once in the dashboard (Storage &
# Databases → D1 → Create → name ipo-desk-accounts), pastes its id here and uncomments the block — ops/site-worker/SETUP.md.
# The id is an identifier, not a secret. Until then /api answers 503 and the page says "not saved"; nothing else changes.
[[d1_databases]]
binding = "DB"
database_name = "ipo-desk-accounts"
database_id = "3a1f6d3d-8e2e-4709-a5c6-698fd19de540"

# The nightly backup (.github/workflows/backup.yml): `wrangler d1 export` of the database above into the R2 bucket named
# here, one dump a night under nightly/<IST date>.sql, 30 kept. The Worker never touches the bucket — there is no
# binding; the name is a var so the workflow and /admin read it from this one place. Hari creates the bucket once in
# the dashboard (R2 → Create bucket → `ipo-desk-backups`, SETUP.md §1c). Restore: scripts/restore_d1.py.
[vars]
BACKUP_BUCKET = "ipo-desk-backups"
